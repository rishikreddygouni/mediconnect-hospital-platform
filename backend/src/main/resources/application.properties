spring.application.name=mediconnect
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mediconnect?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}
server.port=${PORT:8080}
server.forward-headers-strategy=framework
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}
app.cors.origins=${CLIENT_URL:http://localhost:5173}
app.seed.enabled=${SEED_DEMO_DATA:false}
app.seed.admin.email=${SEED_ADMIN_EMAIL:admin@mediconnect.local}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:}
app.seed.doctor.email=${SEED_DOCTOR_EMAIL:doctor@mediconnect.local}
app.seed.doctor.password=${SEED_DOCTOR_PASSWORD:}
app.seed.patient.email=${SEED_PATIENT_EMAIL:patient@mediconnect.local}
app.seed.patient.password=${SEED_PATIENT_PASSWORD:}
app.platform-admin.email=${PLATFORM_ADMIN_EMAIL:}
app.platform-admin.password=${PLATFORM_ADMIN_PASSWORD:}
app.default-hospital.slug=default
