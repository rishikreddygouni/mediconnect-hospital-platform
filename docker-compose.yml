services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mediconnect
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://db:3306/mediconnect?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-604800000}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@mediconnect.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DOCTOR_EMAIL: ${SEED_DOCTOR_EMAIL:-doctor@mediconnect.local}
      SEED_DOCTOR_PASSWORD: ${SEED_DOCTOR_PASSWORD:-}
      SEED_PATIENT_EMAIL: ${SEED_PATIENT_EMAIL:-patient@mediconnect.local}
      SEED_PATIENT_PASSWORD: ${SEED_PATIENT_PASSWORD:-}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      DDL_AUTO: ${DDL_AUTO:-update}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
